[project]
name = "mortgage-assistant"
version = "0.1.0"
description = "Ипотечный ассистент банка: учебный проект воркшопов модуля 2, LLM-разработчик"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "structlog>=24.1",
    "openai-agents>=0.2,<1",
    "openai>=1.50",
    "temporalio>=1.14,<2",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "torch>=2.6,<3",
    "sentence-transformers>=5.1,<6",
    "transformers>=4.56,<5",
    "huggingface-hub[cli]>=0.34,<1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx2>=2.13.1",
    "ruff>=0.14",
    "reportlab>=4.2",
    "pillow>=10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
