services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 2s
      timeout: 2s
      retries: 15

  temporal:
    image: temporalio/auto-setup:1.22
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: bank
      POSTGRES_PWD: bank
      POSTGRES_SEEDS: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7233:7233"
