name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mortgage
          POSTGRES_PASSWORD: mortgage
          POSTGRES_DB: mortgage
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U mortgage -d mortgage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mortgage:mortgage@localhost:5434/mortgage
      TEMPORAL_HOST: 127.0.0.1:7233

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Зависимости из файла блокировки
        run: make install

      - name: Миграции
        run: make migrate

      - name: Линтер
        run: make lint

      - name: Запуск Temporal
        run: docker compose -p mortgage-assistant up -d --wait --wait-timeout 120 temporal

      - name: Тесты
        run: make test

      - name: Логи Temporal при ошибке
        if: failure()
        run: docker compose -p mortgage-assistant logs --no-color temporal

      - name: Остановка Temporal
        if: always()
        run: docker compose -p mortgage-assistant down
